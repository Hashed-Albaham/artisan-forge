name: Artisan Anti-Slop & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  artisan-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for Unsanitized SQL Interpolations
        run: |
          echo "Scanning for raw SQL string interpolations..."
          ! grep -rnE "(SELECT|INSERT|UPDATE|DELETE).*\$\{" src/ || (echo "FAILED: Raw SQL string interpolation found! Use parameterized queries." && exit 1)

      - name: Check for Slop TODO Comments in Merges
        run: |
          echo "Scanning for lazy AI TODO stubs..."
          ! grep -rnE "//\s*TODO:?\s*implement" src/ || (echo "FAILED: Incomplete AI stub comments detected!" && exit 1)

      - name: Run Strict Typechecks
        run: npm run lint